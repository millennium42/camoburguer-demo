services:
  db:
    image: postgres:16.14-alpine
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: ${POSTGRES_DB:-camoburguer}
      POSTGRES_USER: camoburguer
      POSTGRES_PASSWORD: camoburguer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camoburguer -d ${POSTGRES_DB:-camoburguer}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TZ: America/Sao_Paulo
      PORT: 3001
      DATABASE_URL: postgres://camoburguer:camoburguer@db:5432/${POSTGRES_DB:-camoburguer}
      PRINT_BRIDGE_URL: http://print-bridge:3100
      PRINT_BRIDGE_TOKEN: local-print-bridge-token
      DEFAULT_PRINTER: cozinha-principal
      AUTO_SEED: "false"
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      APP_ENV: demo
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_TARGET: ${DEMO_SEED_TARGET:-}
      BUSINESS_TIME_ZONE: America/Sao_Paulo
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      print-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  print-bridge:
    build:
      context: .
      dockerfile: apps/print-bridge/Dockerfile
    environment:
      TZ: America/Sao_Paulo
      PORT: 3100
      PRINT_BRIDGE_MODE: filesystem
      PRINT_SPOOL_DIR: /data/spool
      PRINT_BRIDGE_TOKEN: local-print-bridge-token
    ports:
      - "3100:3100"
    volumes:
      - print-spool:/data/spool
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  event-simulator:
    build:
      context: .
      dockerfile: apps/event-simulator/Dockerfile
    environment:
      TZ: America/Sao_Paulo
      API_BASE_URL: http://api:3001
      DEMO_ADMIN_USERNAME: admin
      DEMO_ADMIN_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - seed

volumes:
  print-spool:
