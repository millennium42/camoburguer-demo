name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: git diff --check
      - run: docker compose -p camoburguer-auto-seed-test up -d db --wait --wait-timeout 120
        env:
          ADMIN_BOOTSTRAP_PASSWORD: ci-demo-admin-password
          POSTGRES_DB: camoburguer_auto_seed_test
      - name: Validar identidade do PostgreSQL efêmero antes de DML
        shell: bash
        run: |
          project=camoburguer-auto-seed-test
          database=camoburguer_auto_seed_test
          published_url="postgres://camoburguer:camoburguer@127.0.0.1:5432/$database"
          [[ "$project" == *test* ]]
          [[ "$database" == *_test ]]
          [[ "$published_url" =~ ^postgres://camoburguer:camoburguer@127\.0\.0\.1:5432/camoburguer_auto_seed_test$ ]]
          container_id="$(POSTGRES_DB="$database" docker compose -p "$project" ps -q db)"
          test -n "$container_id"
          test "$(docker inspect -f '{{.Config.Image}}' "$container_id")" = postgres:16.14-alpine
          test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$container_id")" = "$project"
          [[ "$(docker inspect -f '{{.Name}}' "$container_id")" == *auto-seed-test* ]]
          container_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container_id")"
          [[ "$container_ip" =~ ^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9.]+$ ]]
          test "$(POSTGRES_DB="$database" docker compose -p "$project" exec -T db psql -U camoburguer -d "$database" -Atc 'select current_database()')" = "$database"
          server_identity="$(POSTGRES_DB="$database" docker compose -p "$project" exec -T -e PGPASSWORD=camoburguer db psql -h "$container_ip" -U camoburguer -d "$database" -Atc "select host(inet_server_addr()) || ':' || inet_server_port() || '/' || current_database()")"
          test "$server_identity" = "$container_ip:5432/$database"
      - name: Migrations UP/DOWN e rollback no PostgreSQL efêmero
        run: |
          POSTGRES_DB=camoburguer_auto_seed_test docker compose -p camoburguer-auto-seed-test exec -T db createdb -U camoburguer camoburguer_migrations_test
          npm run test:migrations
        env:
          TEST_MIGRATIONS_DATABASE_URL: postgres://camoburguer:camoburguer@127.0.0.1:5432/camoburguer_migrations_test
      - name: Fuso de São Paulo no PostgreSQL e configurações de deploy
        run: npm run test:timezone
        env:
          TEST_MIGRATIONS_DATABASE_URL: postgres://camoburguer:camoburguer@127.0.0.1:5432/camoburguer_migrations_test
          TEST_COMPOSE_CONFIG: "true"
      - name: Restauração lógica em outro banco efêmero
        run: |
          TEST_POSTGRES_CONTAINER="$(POSTGRES_DB=camoburguer_auto_seed_test docker compose -p camoburguer-auto-seed-test ps -q db)"
          test -n "$TEST_POSTGRES_CONTAINER"
          export TEST_POSTGRES_CONTAINER
          npm run test:recovery
        env:
          REQUIRE_RECOVERY_TESTS: "true"
          TEST_MIGRATIONS_DATABASE_URL: postgres://camoburguer:camoburguer@127.0.0.1:5432/camoburguer_migrations_test
      - name: Testes reais do seed no PostgreSQL efêmero
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://camoburguer:camoburguer@127.0.0.1:5432/camoburguer_auto_seed_test
          TEST_POSTGRES_PROFILE: ci-compose
      - run: POSTGRES_DB=camoburguer_auto_seed_test docker compose -p camoburguer-auto-seed-test down -v
      - run: docker compose -p camoburguer-auto-seed-test up -d --build --wait --wait-timeout 120 api print-bridge
        env:
          ADMIN_BOOTSTRAP_PASSWORD: ci-demo-admin-password
          POSTGRES_DB: camoburguer_auto_seed_test
      - name: Seed explícito no PostgreSQL efêmero do CI
        shell: bash
        run: |
          project=camoburguer-auto-seed-test
          database=camoburguer_auto_seed_test
          container_id="$(POSTGRES_DB="$database" docker compose -p "$project" ps -q db)"
          test -n "$container_id"
          test "$(docker inspect -f '{{.Config.Image}}' "$container_id")" = postgres:16.14-alpine
          test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$container_id")" = "$project"
          [[ "$(docker inspect -f '{{.Name}}' "$container_id")" == *auto-seed-test* ]]
          test "$(POSTGRES_DB="$database" docker compose -p "$project" exec -T db psql -U camoburguer -d "$database" -Atc 'select current_database()')" = "$database"
          effective_url="$(POSTGRES_DB="$database" docker compose -p "$project" exec -T api printenv DATABASE_URL)"
          test "$effective_url" = "postgres://camoburguer:camoburguer@db:5432/$database"
          target="$(POSTGRES_DB="$database" docker compose -p "$project" exec -T db sh -c 'printf "%s:5432/%s" "$(hostname -i | cut -d" " -f1)" "$POSTGRES_DB"')"
          [[ "$target" =~ ^[0-9.]+:5432/camoburguer_auto_seed_test$ ]]
          POSTGRES_DB="$database" ADMIN_BOOTSTRAP_PASSWORD=ci-demo-admin-password \
            DEMO_SEED_ENABLED=true DEMO_SEED_TARGET="$target" \
            docker compose -p "$project" up -d --force-recreate api --wait --wait-timeout 120
          DEMO_API_URL=http://127.0.0.1:3001 \
            ADMIN_USERNAME=admin \
            ADMIN_PASSWORD=ci-demo-admin-password \
            npm run seed:demo -- --confirm-target="$target"
      - run: npm run smoke
        env:
          DATABASE_URL: postgres://camoburguer:camoburguer@127.0.0.1:5432/camoburguer_auto_seed_test
          PRINT_BRIDGE_TOKEN: local-print-bridge-token
          ADMIN_BOOTSTRAP_PASSWORD: ci-demo-admin-password
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          ADMIN_BOOTSTRAP_PASSWORD: ci-demo-admin-password
      - name: Simulador HTTP autenticado e verificável
        run: docker compose -p camoburguer-auto-seed-test --profile seed run --rm --build event-simulator
        env:
          ADMIN_BOOTSTRAP_PASSWORD: ci-demo-admin-password
          POSTGRES_DB: camoburguer_auto_seed_test
      - if: failure()
        name: Coletar artefatos do Compose
        shell: bash
        run: |
          mkdir -p ci-artifacts
          POSTGRES_DB=camoburguer_auto_seed_test docker compose -p camoburguer-auto-seed-test logs --no-color > ci-artifacts/compose.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          if-no-files-found: ignore
          path: |
            ci-artifacts
            playwright-report
            test-results
      - if: always()
        run: POSTGRES_DB=camoburguer_auto_seed_test docker compose -p camoburguer-auto-seed-test down -v
