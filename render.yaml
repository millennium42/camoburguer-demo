databases:
  # 1. Banco de Dados PostgreSQL Gerenciado pelo Render
  - name: camoburguer-db
    databaseName: camoburguer_demo
    user: camoburguer_user
    plan: free

services:
  # 2. API Core (Fastify + Domínio Transacional)
  - type: web
    name: camoburguer-api
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci && npm --prefix apps/ops-web ci --include=dev && npm run build:frontend
    startCommand: node apps/api/src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: camoburguer-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DEFAULT_PRINTER
        value: cozinha-principal
      - key: PRINT_BRIDGE_URL
        fromService:
          type: web
          name: camoburguer-bridge
          property: hostport
      - key: PRINT_BRIDGE_TOKEN
        fromService:
          type: web
          name: camoburguer-bridge
          envVarKey: PRINT_BRIDGE_TOKEN
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: AUTO_SEED
        value: "false"
      - key: APP_ENV
        value: demo
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: BUSINESS_TIME_ZONE
        value: America/Sao_Paulo
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: DEMO_DIRECT_ACCESS
        value: "true"
      - key: DEMO_SEED_TARGET
        sync: false
      - key: VITE_DEMO_MODE
        value: "true"

  # 3. Print Bridge Service (Fastify)
  - type: web
    name: camoburguer-bridge
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci
    startCommand: node apps/print-bridge/src/server.js
    envVars:
      - key: PORT
        value: 3100
      - key: NODE_ENV
        value: production
      - key: PRINT_BRIDGE_TOKEN
        generateValue: true

  # 4. Frontend React publicado como site estatico
  - type: static
    name: camoburguer-ops-web
    buildCommand: npm --prefix apps/ops-web ci --include=dev && npm --prefix apps/ops-web run build
    staticPublishPath: apps/ops-web/dist
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_DEMO_MODE
        value: "true"
