databases:
  # 1. Banco de Dados PostgreSQL Gerenciado pelo Render
  - name: camoburguer-db
    databaseName: camoburguer
    user: camoburguer_user
    plan: free

services:
  # 2. API Core (Fastify + Domínio Transacional)
  - type: web
    name: camoburguer-api
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: node apps/api/src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: camoburguer-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DEFAULT_PRINTER
        value: cozinha-principal
      - key: PRINT_BRIDGE_URL
        fromService:
          type: web
          name: camoburguer-bridge
          property: hostport
      - key: PRINT_BRIDGE_TOKEN
        fromService:
          type: web
          name: camoburguer-bridge
          envVarKey: PRINT_BRIDGE_TOKEN
      - key: CORS_ORIGINS
        value: https://camoburguer-api.onrender.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: AUTO_SEED
        value: "false"
      - key: APP_ENV
        value: demo
      - key: BUSINESS_TIME_ZONE
        value: America/Sao_Paulo
      - key: DEMO_SEED_ENABLED
        value: "false"
      - key: DEMO_SEED_TARGET
        value: ""

  # 3. Print Bridge Service (Fastify)
  - type: web
    name: camoburguer-bridge
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: node apps/print-bridge/src/server.js
    envVars:
      - key: PORT
        value: 3100
      - key: NODE_ENV
        value: production
      - key: PRINT_BRIDGE_TOKEN
        generateValue: true
